events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate Limiting : 30 requêtes/seconde par adresse IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Format de log structuré avec x-request-id
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$request_id"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream auth_service {
        server auth:3000;
    }

    server {
        listen 8080;

        # Sécurité : rate limit actif avec burst
        limit_req zone=api_limit burst=50 nodelay;

        # Propage ou génère un X-Request-ID unique
        add_header X-Request-ID $request_id always;

        # Health check du Gateway lui-même
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Service d'authentification
        location /api/v1/auth/ {
            proxy_pass http://auth_service/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Documentation Swagger OpenAPI (/docs/auth)
        location /docs/auth/ {
            proxy_pass http://auth_service/docs/;
            proxy_set_header Host $host;
        }

        # Erreur 404 standard en format problem+json
        error_page 404 /404.json;
        location = /404.json {
            default_type application/problem+json;
            return 404 '{"title":"Not Found","status":404,"detail":"Route inconnue sur le gateway"}';
        }
    }
}
