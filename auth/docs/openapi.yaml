openapi: 3.1.0
info:
  title: PolyShop — Auth API
  version: 1.0.0
  description: Inscription, connexion et émission de JWT (TP3).
servers:
  - { url: http://localhost:3002/api/v1, description: Développement local (port publié 3002) }
  - { url: http://localhost:8080/api/v1, description: Via le gateway (TP4) }
paths:
  /auth/register:
    post:
      summary: Crée un compte
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Email déjà utilisé, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/login:
    post:
      summary: Connexion, renvoie un JWT (15 min)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '401': { description: Identifiants invalides, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { description: Trop de tentatives }
  /auth/me:
    get:
      summary: Profil de l'utilisateur authentifié
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Non authentifié }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: leia@polyshop.fr }
        password: { type: string, minLength: 8, example: correct-horse-battery }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: string, format: date-time }
    Token:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 900 }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    ValidationError:
      description: Requête invalide
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
